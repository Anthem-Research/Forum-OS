<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><title>Projects</title><style>
*{box-sizing:border-box}body{margin:0;color:#181818;background:white;font:400 17px/1.5 system-ui,-apple-system,sans-serif}main{max-width:920px;margin:auto;padding:24px clamp(20px,5vw,52px) 70px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px}header span{font-size:12px;letter-spacing:.24em}button,input,select{font:inherit;color:inherit}button{background:white;border:1px solid #ddd;border-radius:8px;padding:12px 16px;cursor:pointer;min-height:48px}button:focus-visible,input:focus-visible{outline:2px solid #111;outline-offset:3px}button.primary{background:#161616;color:white;border-color:#161616}h1{font-size:clamp(34px,6vw,54px);font-weight:300;letter-spacing:-.045em;margin:0 0 8px}h2{font-size:23px;font-weight:400;margin:36px 0 12px}p{margin:4px 0;color:#666}.date{font-size:14px;margin-bottom:30px}.task{display:flex;align-items:center;gap:15px;padding:18px 0;border-bottom:1px solid #e8e8e8}.task .copy{flex:1}.task strong{font-weight:450;font-size:19px;display:block}.task small{color:#777;display:block;font-size:13px}.check{width:48px;height:48px;flex:none;border:1px solid #999;border-radius:50%;padding:0;font-size:24px}.done .check{background:#171717;color:white;border-color:#171717}.done strong{text-decoration:line-through;color:#777}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.project{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:160px;padding:20px;border:1px solid #ddd;border-radius:8px}.project svg{width:75px;height:65px;margin:0 0 12px}.project b{font-size:20px;font-weight:450}.project small{color:#777}.nav{display:flex;gap:10px;align-items:center;margin-bottom:24px}.nav button{border:0;padding:0 12px;font-size:25px}.empty{padding:16px 0;color:#666}.note{font-size:14px;color:#666}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.editrow{border-bottom:1px solid #ddd;padding:15px 0}.editrow label,label.field{display:block;font-size:13px;color:#666;margin-bottom:4px}input,select{border:1px solid #ccc;background:#fff;border-radius:5px;padding:10px;max-width:100%;min-height:45px;width:100%}.fields{display:grid;grid-template-columns:1fr 145px;gap:10px;align-items:end}.editrow button{margin-top:8px;font-size:14px}.hidden,[hidden]{display:none!important}.textbutton{border:0;color:#666;font-size:13px}.log{font-size:14px;padding:10px 0;border-bottom:1px solid #eee}.hero{width:108px;height:100px}.muted{color:#777;font-size:14px}#notice{color:#555;font-size:14px}.manual{min-width:110px}footer{margin-top:34px;font-size:13px;color:#777}@media(max-width:480px){header{margin-bottom:30px}.task strong{font-size:17px}.fields{grid-template-columns:1fr}.cards{grid-template-columns:1fr 1fr}.project{padding:13px}}
</style></head><body><main><header><span>PARC</span><div><button id="install" class="textbutton" hidden>Install</button><button id="manage" class="textbutton">Manage</button></div></header><div id="notice" role="status"></div><div id="screen"></div></main><script>
'use strict';
const $=id=>document.getElementById(id),screen=$('screen'),KEY='parc.projects.v1';
const dateKey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const shift=(key,n)=>{const [y,m,d]=key.split('-').map(Number);const x=new Date(y,m-1,d+n,12);return dateKey(x)};
const today=()=>dateKey(),fmt=k=>new Date(k+'T12:00:00').toLocaleDateString('en-ZA',{day:'numeric',month:'short'});
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
function seed(){return [{id:'garden',name:'Rosemary garden',kind:'plant',tasks:[{id:'soil',name:'Check the soil',hint:'Feel the soil. Water only if it is dry.',days:2,due:today(),log:[]},{id:'leaves',name:'Look at the leaves',hint:'Check for dry leaves or pests.',days:7,due:today(),log:[]}]},{id:'boat',name:'Boat',kind:'boat',tasks:[{id:'rinse',name:'Rinse the boat',hint:'After every trip. Use fresh water with an adult.',days:0,due:today(),log:[]},{id:'dry',name:'Dry and store the gear',hint:'After every trip. Put the life jackets away.',days:0,due:today(),log:[]},{id:'check',name:'Check the ropes and boat',hint:'Look for damage with an adult. Tell an adult if you find any.',days:7,due:today(),log:[]}]}]}
let projects;try{const saved=localStorage.getItem(KEY);projects=saved?JSON.parse(saved):seed();if(!Array.isArray(projects))throw Error()}catch{projects=seed();$('notice').textContent='Saved projects could not be loaded.'}
let view='home',active=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(projects));return true}catch{$('notice').textContent='Storage is unavailable. Changes may not be saved.';return false}}
const node=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
function button(text,fn,cls=''){const b=node('button',cls,text);b.type='button';b.addEventListener('click',fn);return b}
function add(parent,...els){parent.append(...els);return parent}
function icon(kind){const box=node('div');box.innerHTML='<svg viewBox="0 0 100 80" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+(kind==='plant'?'<path d="M29 56h42l-6 19H35zM50 56V8M50 46c-14-3-21-8-26-17 13-1 22 6 26 12M50 36c13-3 22-10 25-19-12 0-20 6-25 14M50 25c-10-4-14-9-15-17 8 2 13 7 15 13M50 51c12-3 20-8 25-15-12 0-20 4-25 11"/>':kind==='boat'?'<path d="M12 52h76l-13 15H27zM47 52V9M49 12l28 33H49zM44 22L23 45h21zM7 73q9-5 18 0t18 0t18 0t18 0t14 0"/>':'<rect x="20" y="19" width="60" height="52" rx="4"/><path d="M20 35h60M39 19v-8h22v8M42 48h16"/>')+'</svg>';return box.firstChild}
function isDue(t){return t.days>0&&t.due<=today()}
function completedToday(t){return t.log.length&&t.log[t.log.length-1].date===today()}
function complete(t){if(completedToday(t))return;t.log.push({date:today(),previous:t.due});if(t.days>0)t.due=shift(today(),t.days);save();render()}
function undo(t){const last=t.log.pop();if(last){t.due=last.previous||today();save();render()}}
function taskRow(p,t,done=false){const row=node('div','task'+(done?' done':''));const copy=node('div','copy');add(copy,node('strong','',t.name),node('small','',p.name+' · '+t.hint));const b=button(done?'✓':'',()=>done?undo(t):complete(t),'check');b.setAttribute('aria-label',(done?'Undo ':'Complete ')+t.name);add(row,copy,b);return row}
function showHome(){view='home';active=null;render()}
function showProject(id){view='project';active=id;render()}
function nav(title){const n=node('div','nav');add(n,button('←',showHome),node('span','muted',title));screen.append(n)}
function render(){screen.replaceChildren();$('manage').textContent=view==='manage'?'Done':'Manage';if(view==='manage'){renderManage();return}if(view==='project'){const p=projects.find(x=>x.id===active);if(!p){showHome();return}nav('Projects');const im=icon(p.kind);im.classList.add('hero');add(screen,im,node('h1','',p.name));const due=p.tasks.filter(isDue);if(due.length){screen.append(node('h2','','To do'));due.forEach(t=>screen.append(taskRow(p,t)))}const manual=p.tasks.filter(t=>!t.days);if(manual.length){screen.append(node('h2','','After use'));manual.forEach(t=>screen.append(taskRow(p,t,completedToday(t))))}const next=p.tasks.filter(t=>t.days&&!isDue(t));if(next.length){screen.append(node('h2','','Next'));next.forEach(t=>{const r=node('div','task');add(r,node('div','copy',t.name),node('small','',fmt(t.due)));screen.append(r)})}const log=p.tasks.flatMap(t=>t.log.map(l=>({name:t.name,date:l.date}))).sort((a,b)=>b.date.localeCompare(a.date));if(log.length){screen.append(node('h2','','History'));log.slice(0,30).forEach(l=>screen.append(node('div','log',fmt(l.date)+' · '+l.name)))}return}
add(screen,node('h1','','Today'),node('p','date',new Date().toLocaleDateString('en-ZA',{weekday:'long',day:'numeric',month:'long'})));let due=0,done=0;projects.forEach(p=>p.tasks.filter(isDue).forEach(t=>{due++;screen.append(taskRow(p,t))}));if(!due)screen.append(node('p','empty','Nothing needs doing today.'));projects.forEach(p=>p.tasks.filter(t=>t.days&&completedToday(t)).forEach(t=>{if(!done++)screen.append(node('h2','','Done today'));screen.append(taskRow(p,t,true))}));screen.append(node('h2','','My projects'));const cards=node('div','cards');projects.forEach(p=>{const b=button('',()=>showProject(p.id),'project');const n=p.tasks.filter(isDue).length;add(b,icon(p.kind),node('b','',p.name),node('small','',n?n+' to do':'Up to date'));cards.append(b)});screen.append(cards);if(!projects.length)screen.append(node('p','empty','Add a project in Manage.'))}
function field(label,value,change,opts){const l=node('label','field',label);let el;if(opts){el=node('select');opts.forEach(([v,s])=>{const o=node('option','',s);o.value=v;el.append(o)});el.value=value}else{el=node('input');el.value=value;el.maxLength=100}el.addEventListener('change',()=>{change(el.value);save()});l.append(el);return l}
function renderManage(){nav('Projects');screen.append(node('h1','','Manage projects'),node('p','','Add responsibilities or change when they repeat.'));projects.forEach(p=>{const section=node('section');section.append(node('h2','',p.name));section.append(field('Project name',p.name,v=>{if(v.trim())p.name=v.trim()}));p.tasks.forEach(t=>{const r=node('div','editrow');const f=node('div','fields');add(f,field('Task',t.name,v=>{if(v.trim())t.name=v.trim()}),field('Repeat',String(t.days),v=>{t.days=Number(v);const last=t.log[t.log.length-1];t.due=t.days&&last?shift(last.date,t.days):today()},[['0','After use'],['1','Daily'],['2','Every 2 days'],['3','Every 3 days'],['7','Weekly'],['14','Every 2 weeks'],['30','Every 30 days']]));add(r,f,field('Instruction',t.hint,v=>t.hint=v.trim()),button('Remove task',()=>{if(confirm('Remove this task and its history?')){p.tasks=p.tasks.filter(x=>x.id!==t.id);save();render()}},'textbutton'));section.append(r)});const a=node('div','actions');add(a,button('+ Task',()=>{p.tasks.push({id:uid(),name:'New task',hint:'',days:7,due:today(),log:[]});save();render()}),button('Remove project',()=>{if(confirm('Remove this project and its history?')){projects=projects.filter(x=>x.id!==p.id);save();render()}},'textbutton'));section.append(a);screen.append(section)});const a=node('div','actions');add(a,button('+ Project',()=>{projects.push({id:uid(),name:'New project',kind:'other',tasks:[]});save();render()},'primary'),button('Done',showHome));screen.append(a);screen.append(node('footer','','Saved on this tablet. Reminders appear when you open Projects.'))}
$('manage').addEventListener('click',()=>{if(view==='manage')showHome();else{view='manage';render()}});let installPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('install').hidden=false});$('install').addEventListener('click',async()=>{if(!installPrompt)return;await installPrompt.prompt();installPrompt=null;$('install').hidden=true});window.addEventListener('appinstalled',()=>{$('install').hidden=true});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&view!=='manage')render()});save();render();
</script></body></html>
