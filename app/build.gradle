plugins {
    id "com.android.application"
}

android {
    namespace "org.forum.os"
    compileSdk 36

    defaultConfig {
        applicationId "org.forum.os"
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
        manifestPlaceholders = [forumTestOnly: "false"]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = false
        aidl = false
        renderScript = false
        shaders = false
    }

    packaging {
        resources {
            excludes += ["META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"]
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders = [forumTestOnly: "true"]
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
        warningsAsErrors false
        disable += ["GradleDependency"]
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
