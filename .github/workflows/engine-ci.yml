name: Forum Engine CI

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/engine-ci.yml"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/engine-ci.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forum-engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application and public-build checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    env:
      PAGES_BASE_PATH: /Forum-OS
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Lint application
        run: npm run lint
      - name: Check TypeScript
        run: npm run typecheck
      - name: Run unit tests
        run: npm run test
      - name: Build static application
        run: npm run build
      - name: Verify public artifact
        run: npm run test:leakage
