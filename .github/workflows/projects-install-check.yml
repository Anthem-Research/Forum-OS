name: Verify deployed PARC Projects
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/projects-install-check.yml"
      - "engine/public/projects/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the deployed PWA in Chromium
        run: node engine/scripts/check-projects-install.mjs
