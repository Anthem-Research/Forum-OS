name: Verify deployed PARC Projects
on:
  workflow_run:
    workflows: [Deploy Forum Engine to GitHub Pages]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the deployed PWA in Chromium
        run: node engine/scripts/check-projects-install.mjs
